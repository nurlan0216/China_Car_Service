<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script>(function(){try{var t=localStorage.getItem('ccs-theme');if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stories test</title>
<link rel="stylesheet" href="css/theme.css">
<script src="js/ui-fx.js"></script>
<script src="js/theme.js" defer></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);padding:22px;min-height:100vh}
.wrap{max-width:620px;margin:auto}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.announce{background:var(--banner-a);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:16px;line-height:1.4}
.announce-media{max-width:100%;border-radius:10px;margin-top:8px;display:block}.muted{color:var(--muted);font-size:11px;margin-top:5px}
.tag{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:4px 8px;font-size:11px;margin-bottom:8px}
</style>
</head>
<body class="ccs-bg-client"><div class="wrap"><div class="card"><div style="font-weight:800;font-size:20px;margin-bottom:4px">🚕 Мой автомобиль</div><div class="muted" style="font-size:13px;margin:0 0 14px">Кабинет водителя</div><div class="announce"><div style="font-weight:800;margin-bottom:8px">📢 Объявления</div><div style="padding:10px 0;border-top:1px solid #1f3a5c"><div>Новые автомобили уже в продаже! Приглашаем посмотреть предложение.</div><img class="announce-media" src="test_photo.jpg" alt="Объявление"><div class="muted">Активно ещё примерно 24 ч.</div></div></div><div class="muted">Тестовый визуальный отчёт — макет построен по текущей разметке driver.html.</div></div></div></body></html>
