<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>China Car Service</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1318">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0f1720; --card:#182130; --accent:#3b82f6; --accent-2:#22c55e;
    --text:#e5e9f0; --muted:#8a97ab; --border:#26324a; --danger:#ef4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:16px;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .wrap{max-width:360px; width:100%; text-align:center;}
  .logo-badge{margin:0 auto 14px; width:84px; height:84px; display:block;}
  .logo{
    font-weight:800; letter-spacing:1px; font-size:15px; color:var(--muted);
    margin-bottom:6px;
  }
  h1{font-size:22px; margin:0 0 6px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:28px;}
  .choice{
    display:block; width:100%; text-align:left; background:var(--card);
    border:1px solid var(--border); border-radius:14px; padding:18px 16px;
    margin-bottom:14px; cursor:pointer; text-decoration:none; color:var(--text);
  }
  .choice:active{border-color:var(--accent);}
  .choice .emoji{font-size:26px; margin-bottom:6px; display:block;}
  .choice .title{font-size:16px; font-weight:700; margin-bottom:2px;}
  .choice .desc{font-size:13px; color:var(--muted);}
  .choice.driver .title{color:var(--accent-2);}
  .choice.staff .title{color:var(--accent);}
  .choice.act{padding:14px 16px; margin-bottom:0; margin-top:6px;}
  .choice.act .title{color:var(--muted); font-size:14px;}
  .choice.act .emoji{font-size:20px; margin-bottom:4px;}

  /* --- кнопка установки в углу --- */
  #installCorner{
    position:fixed; top:12px; right:12px; z-index:50;
    display:none; align-items:center; gap:6px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    color:#0b1220; font-weight:700; font-size:12.5px;
    border:none; border-radius:999px; padding:9px 14px;
    cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  #installCorner:active{opacity:.85;}
  #installCorner .ic{font-size:14px;}

  .install-modal-bg{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
    z-index:100; align-items:flex-end; justify-content:center;
  }
  .install-modal-bg.show{display:flex;}
  .install-modal{
    background:var(--card); border:1px solid var(--border);
    border-radius:18px 18px 0 0; padding:20px 18px 26px; width:100%;
    max-width:420px; text-align:left; animation:slideUp .2s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(20px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .install-modal h2{font-size:17px; margin:0 0 12px;}
  .install-modal .step{font-size:13.5px; line-height:1.55; margin:6px 0;}
  .install-modal b{color:var(--accent-2);}
  .install-modal .close-btn{
    display:block; width:100%; margin-top:16px; background:var(--border);
    color:var(--text); border:none; border-radius:12px; padding:12px;
    font-weight:700; font-size:14px; cursor:pointer;
  }
</style>
</head>
<body>

  <button id="installCorner">
    <span class="ic">⬇️</span><span>Установить</span>
  </button>

  <div class="install-modal-bg" id="installModalBg">
    <div class="install-modal">
      <h2>Установка приложения</h2>
      <div id="installModalBody">
        <!-- заполняется скриптом в зависимости от платформы -->
      </div>
      <button class="close-btn" id="installModalClose">Понятно</button>
    </div>
  </div>

  <div class="wrap">
    <svg class="logo-badge" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#3b82f6"/>
          <stop offset="100%" stop-color="#22c55e"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="47" fill="#182130" stroke="url(#badgeGrad)" stroke-width="3"/>
      <path d="M28 60 L33 46 C34.5 42 37 40 41.5 40 L58.5 40 C63 40 65.5 42 67 46 L72 60"
            fill="none" stroke="url(#badgeGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="24" y="58" width="52" height="14" rx="7" fill="none" stroke="url(#badgeGrad)" stroke-width="3.2"/>
      <circle cx="36" cy="73" r="5.5" fill="#0f1720" stroke="url(#badgeGrad)" stroke-width="3"/>
      <circle cx="64" cy="73" r="5.5" fill="#0f1720" stroke="url(#badgeGrad)" stroke-width="3"/>
      <rect x="40" y="47" width="8" height="6" rx="1.5" fill="#0f1720"/>
      <rect x="52" y="47" width="8" height="6" rx="1.5" fill="#0f1720"/>
    </svg>
    <div class="logo">CHINA CAR SERVICE</div>
    <h1>Учёт автопарка</h1>
    <div class="sub">Выберите, кто вы</div>

    <a class="choice driver" href="driver.html">
      <span class="emoji">🚕</span>
      <div class="title">Я водитель</div>
      <div class="desc">История ТО моей машины, акты, PDF-выгрузка — по гос. номеру</div>
    </a>

    <a class="choice staff" href="to.html">
      <span class="emoji">🔧</span>
      <div class="title">Я сотрудник СТО</div>
      <div class="desc">Учёт ТО автопарка — вход по коду доступа</div>
    </a>

    <a class="choice act" href="act.html">
      <span class="emoji">📝</span>
      <div class="title">Акт приёма-передачи ТС</div>
      <div class="desc">Оформить акт приёма-передачи автомобиля</div>
    </a>
  </div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('service-worker.js').catch(function (err) {
        console.log('SW registration failed:', err);
      });
    });
  }

  (function () {
    var cornerBtn = document.getElementById('installCorner');
    var modalBg = document.getElementById('installModalBg');
    var modalBody = document.getElementById('installModalBody');
    var modalClose = document.getElementById('installModalClose');

    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.navigator.standalone === true; // iOS Safari
    }

    // Уже установлено — кнопку вообще не показываем.
    if (isStandalone()) return;

    var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var deferredPrompt = null;

    function openModal(html) {
      modalBody.innerHTML = html;
      modalBg.classList.add('show');
    }
    function closeModal() {
      modalBg.classList.remove('show');
    }
    modalClose.addEventListener('click', closeModal);
    modalBg.addEventListener('click', function (e) {
      if (e.target === modalBg) closeModal();
    });

    var iosSteps =
      '<div class="step">1. Нажмите кнопку <b>«Поделиться»</b> внизу экрана Safari (значок ⬆️ в квадрате).</div>' +
      '<div class="step">2. В списке выберите <b>«На экран «Домой»»</b>.</div>' +
      '<div class="step">3. Нажмите <b>«Добавить»</b>.</div>' +
      '<div class="step">4. После этого откройте приложение с иконки на рабочем столе.</div>';

    var fallbackSteps =
      '<div class="step">Этот браузер не поддерживает установку приложения напрямую.</div>' +
      '<div class="step">Откройте эту ссылку в <b>Chrome</b> (Android) или <b>Safari</b> (iPhone) и установите оттуда — либо через меню браузера выберите <b>«Установить приложение»</b> / <b>«Добавить на главный экран»</b>.</div>';

    // Chrome/Edge/Android: браузер сообщает, что установку можно предложить нативно.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      cornerBtn.style.display = 'flex';
    });

    window.addEventListener('appinstalled', function () {
      cornerBtn.style.display = 'none';
      closeModal();
    });

    cornerBtn.addEventListener('click', function () {
      if (deferredPrompt) {
        // Прямой вызов системного окна установки Chrome/Edge/Android.
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () {
          deferredPrompt = null;
        });
      } else if (isIOS) {
        openModal(iosSteps);
      } else {
        openModal(fallbackSteps);
      }
    });

    if (isIOS) {
      // На iOS нет beforeinstallprompt — просто всегда показываем кнопку с инструкцией.
      cornerBtn.style.display = 'flex';
    } else {
      // На прочих браузерах ждём beforeinstallprompt; если через 1.5с его нет —
      // это либо неподдерживаемый браузер, либо встроенный браузер соцсети.
      setTimeout(function () {
        if (!deferredPrompt) {
          cornerBtn.style.display = 'flex';
        }
      }, 1500);
    }
  })();
</script>
</body>
</html>
