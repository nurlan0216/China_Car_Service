<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  :root{ --bg:#0f1720; --card:#182130; --text:#e5e9f0; --muted:#8a97ab; --border:#26324a; }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text);
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .wrap{max-width:420px; width:100%;}
  h1{font-size:22px; text-align:center; margin-bottom:6px;}
  .sub{color:var(--muted); font-size:13px; text-align:center; margin-bottom:28px;}
  a.card{
    display:block; background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:20px; margin-bottom:14px; text-decoration:none; color:var(--text);
  }
  a.card .ico{font-size:26px;}
  a.card h3{margin:8px 0 4px; font-size:16px;}
  a.card p{margin:0; color:var(--muted); font-size:13px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>China Car Service</h1>
    <div class="sub">Выберите раздел</div>

    <a class="card" href="act.html">
      <div class="ico">📋</div>
      <h3>Акт приёма-передачи</h3>
      <p>Оформление приёма или выдачи автомобиля клиенту</p>
    </a>

    <a class="card" href="to.html">
      <div class="ico">🔧</div>
      <h3>Учёт ТО</h3>
      <p>Только для сотрудников — требуется код доступа</p>
    </a>
  </div>
</body>
</html>
